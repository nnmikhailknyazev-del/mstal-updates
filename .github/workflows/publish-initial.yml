name: Publish signed update
on:
  push:
    paths:
      - '.github/workflows/publish-initial.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify signed distribution
        env:
          DIST_URL: "https://sdmntprsoutheastus3.oaiusercontent.com/files/00000000-2e4c-820c-ab98-e561383a68c7/raw?se=2026-10-21T18%3A46%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=14c72040-48e6-49f9-855a-1588f7950d34&skoid=db055408-822b-485f-92f8-bfeb3ea92408&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-21T15%3A16%3A00Z&ske=2026-10-22T15%3A16%3A00Z&sks=b&skv=2026-02-06&sig=EEp3YulV71PQEBEUzGRZigOxrVFWs9laLHi5nxpz4Hw%3D"
        run: |
          python3 - <<'PY'
          import os,urllib.request,zipfile,io,json,hashlib
          from pathlib import Path
          data=urllib.request.urlopen(os.environ['DIST_URL'],timeout=60).read()
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              apk=z.read('M-stal-Calculator.apk')
              manifest=z.read('update.json')
          meta=json.loads(manifest)
          assert meta['versionCode']==4
          assert len(meta['sha256'])==64
          assert hashlib.sha256(apk).hexdigest()==meta['sha256']
          assert meta['apkUrl']=='https://raw.githubusercontent.com/nnmikhailknyazev-del/mstal-updates/main/M-stal-Calculator.apk'
          Path('M-stal-Calculator.apk').write_bytes(apk)
          Path('update.json').write_bytes(manifest)
          PY
      - name: Publish APK and version information together
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add M-stal-Calculator.apk update.json
          git commit -m "Publish signed calculator 0.3.1"
          git push
